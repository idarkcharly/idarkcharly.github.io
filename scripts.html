<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scripts en Python para automatizar tareas de modding y desarrollo.">
    <meta name="theme-color" content="#7c000c">
    <meta property="og:type" content="website">
    <meta property="og:title" content="CharlyModding | Scripts">
    <meta property="og:description" content="Scripts en Python para tareas de modding.">
    <meta property="og:url" content="https://charlymodding.xyz/scripts.html">
    <title>CharlyModding | Scripts</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/site.js" defer></script>
</head>

<body>

    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <div class="page-content">

        <!-- NAV -->
        <nav>
            <a href="index.html">Inicio</a>
            <a href="resources.html">Recursos</a>
            <a href="mods.html">Mods</a>
            <a href="scripts.html">Scripts</a>
            <a href="about.html">Sobre mí</a>
        </nav>

        <main id="main-content">
        <!-- HEADER -->
        <header>
            <h1>Scripts en Python</h1>
            <p style="color: var(--muted); margin-top:4px;">
                Herramientas para automatizar tareas de modding
            </p>
        </header>

        <!-- CONTENIDO -->
        <section class="resources">
            <div class="card-grid" id="scripts-container" aria-live="polite">
                <!-- Cards generadas desde JSON -->
            </div>
        </section>

        </main>

    </div>

    <footer>
        <span data-year></span> CharlyModding
    </footer>

    <!-- SCRIPT -->
    <script>
        fetch("assets/data/scripts.json")
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById("scripts-container");

                if (!Array.isArray(data.scripts) || data.scripts.length === 0) {
                    container.innerHTML = '<p class="state-message">Todavía no hay scripts publicados.</p>';
                    return;
                }

                data.scripts.forEach(script => {
                    const card = document.createElement("div");
                    card.className = "card";

                    const title = document.createElement("h3");
                    title.textContent = script.title;

                    const description = document.createElement("p");
                    description.className = "card-description";
                    description.textContent = script.description;

                    const actions = document.createElement("div");
                    actions.className = "card-actions";

                    const downloadLink = document.createElement("a");
                    downloadLink.href = "#";
                    downloadLink.className = "download-btn";
                    downloadLink.dataset.url = script.download_url;
                    downloadLink.textContent = "Descargar";

                    const viewLink = document.createElement("a");
                    viewLink.href = script.view_url;
                    viewLink.target = "_blank";
                    viewLink.rel = "noopener noreferrer";
                    viewLink.className = "download-btn";
                    viewLink.textContent = "Ver código";

                    actions.append(downloadLink, viewLink);
                    card.append(title, description, actions);

                    container.appendChild(card);
                });

                // Descargar usando fetch + blob
                document.querySelectorAll(".download-btn[data-url]").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        e.preventDefault();

                        const url = btn.dataset.url;
                        const filename = url.split("/").pop();

                        fetch(url)
                            .then(res => {
                                if (!res.ok) throw new Error("Error descargando archivo");
                                return res.blob();
                            })
                            .then(blob => {
                                const a = document.createElement("a");
                                a.href = URL.createObjectURL(blob);
                                a.download = filename;
                                document.body.appendChild(a);
                                a.click();
                                a.remove();
                                URL.revokeObjectURL(a.href);
                            })
                            .catch(err => {
                                alert("No se pudo descargar el archivo");
                                console.error(err);
                            });
                    });
                });
            })
            .catch(err => {
                const container = document.getElementById("scripts-container");
                container.innerHTML = '<p class="state-message">No fue posible cargar los scripts en este momento.</p>';
                console.error("Error cargando scripts.json:", err);
            });
    </script>

</body>

</html>
