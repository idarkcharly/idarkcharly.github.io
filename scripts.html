<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scripts en Python para automatizar tareas de modding y desarrollo.">
    <meta name="theme-color" content="#8b0010">
    <meta property="og:type" content="website">
    <meta property="og:title" content="CharlyModding | Scripts">
    <meta property="og:description" content="Scripts en Python para tareas de modding.">
    <meta property="og:url" content="https://charlymodding.xyz/scripts.html">
    <title>CharlyModding | Scripts</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/site.js" defer></script>
</head>

<body>

    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <div class="page-content">

        <nav>
            <a href="index.html">Inicio</a>
            <a href="resources.html">Recursos</a>
            <a href="mods.html">Mods</a>
            <a href="scripts.html">Scripts</a>
            <a href="about.html">Sobre mí</a>
        </nav>

        <main id="main-content">

            <header class="page-header">
                <h1>Scripts en Python</h1>
                <p>Herramientas para automatizar tareas de modding · descarga o consulta el código</p>
            </header>

            <section class="resources">
                <div class="card-grid" id="scripts-container" aria-live="polite">
                    <!-- Cards generadas desde JSON -->
                </div>
            </section>

        </main>

    </div>

    <footer>
        <span data-year></span> CharlyModding
    </footer>

    <script>
        const PYTHON_ICON = `<svg viewBox="0 0 24 24"><path d="M11.97 2C9.11 2 7 3.19 7 4.75V7h5v.5H5.25C3.45 7.5 2 9.06 2 11.25c0 2.17 1.37 3.75 3.25 3.75H6v-2.25C6 10.56 7.87 9 10.25 9H14c1.8 0 3-.9 3-2.25V4.75C17 3.19 14.83 2 11.97 2zm-1.47 1.5c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM18 9v2.25c0 2.19-2 3.75-4.25 3.75H10c-1.8 0-3 .9-3 2.25v2.5C7 20.81 9.17 22 12.03 22c2.86 0 4.97-1.19 4.97-2.75V17h-5v-.5h6.75c1.8 0 3.25-1.56 3.25-3.75 0-2.17-1.37-3.75-3.25-3.75H18zm-4.5 9.5c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/></svg>`;
        const DOWNLOAD_SVG = `<svg viewBox="0 0 24 24"><path d="M12 16l4-5h-3V4h-2v7H8l4 5zm-7 2v2h14v-2H5z"/></svg>`;
        const CODE_SVG = `<svg viewBox="0 0 24 24"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>`;

        fetch("assets/data/scripts.json")
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById("scripts-container");

                if (!Array.isArray(data.scripts) || data.scripts.length === 0) {
                    container.innerHTML = '<p class="state-message">Todavía no hay scripts publicados.</p>';
                    return;
                }

                data.scripts.forEach(script => {
                    const card = document.createElement("div");
                    card.className = "card";

                    // Imagen de demostración (opcional)
                    if (script.image) {
                        const thumbWrap = document.createElement("div");
                        thumbWrap.className = "script-thumb";
                        const img = document.createElement("img");
                        img.src = script.image;
                        img.alt = script.image_alt || script.title;
                        img.loading = "lazy";
                        thumbWrap.appendChild(img);
                        card.appendChild(thumbWrap);
                    } else {
                        // Icono Python por defecto si no hay imagen
                        const iconBox = document.createElement("div");
                        iconBox.className = "script-icon";
                        iconBox.innerHTML = PYTHON_ICON;
                        card.appendChild(iconBox);
                    }

                    const title = document.createElement("h3");
                    title.textContent = script.title;

                    const description = document.createElement("p");
                    description.className = "card-description";
                    description.textContent = script.description;

                    const actions = document.createElement("div");
                    actions.className = "card-actions";

                    const downloadLink = document.createElement("a");
                    downloadLink.href = "#";
                    downloadLink.className = "download-btn";
                    downloadLink.dataset.url = script.download_url;
                    downloadLink.innerHTML = DOWNLOAD_SVG + " Descargar";

                    const viewLink = document.createElement("a");
                    viewLink.href = script.view_url;
                    viewLink.target = "_blank";
                    viewLink.rel = "noopener noreferrer";
                    viewLink.className = "download-btn btn-outline";
                    viewLink.style.cssText = "background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--text);";
                    viewLink.innerHTML = CODE_SVG + " Ver código";

                    actions.append(downloadLink, viewLink);
                    card.append(title, description, actions);
                    container.appendChild(card);
                });

                // Descargar usando fetch + blob
                document.querySelectorAll(".download-btn[data-url]").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        e.preventDefault();
                        const url = btn.dataset.url;
                        const filename = url.split("/").pop();

                        btn.textContent = "Descargando…";
                        btn.style.opacity = "0.7";
                        btn.style.pointerEvents = "none";

                        fetch(url)
                            .then(res => {
                                if (!res.ok) throw new Error("Error descargando archivo");
                                return res.blob();
                            })
                            .then(blob => {
                                const a = document.createElement("a");
                                a.href = URL.createObjectURL(blob);
                                a.download = filename;
                                document.body.appendChild(a);
                                a.click();
                                a.remove();
                                URL.revokeObjectURL(a.href);
                            })
                            .catch(() => alert("No se pudo descargar el archivo"))
                            .finally(() => {
                                btn.innerHTML = DOWNLOAD_SVG + " Descargar";
                                btn.style.opacity = "";
                                btn.style.pointerEvents = "";
                            });
                    });
                });
            })
            .catch(() => {
                const container = document.getElementById("scripts-container");
                container.innerHTML = '<p class="state-message">No fue posible cargar los scripts en este momento.</p>';
            });
    </script>

</body>

</html>
